<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vayumitre — Driver console</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  body{margin:0;background:#E9ECE7}
  a{color:#1F6B48}
  .mono{font-family:'IBM Plex Mono', monospace}
  #act:disabled{background:#C9D1CB;cursor:default}
  #act.ghost{background:#FFFFFF;color:#18211C;border:1px solid #C9D1CB}
  #zsel{border:0;background:transparent;font:inherit;color:#18211C;font-weight:500;padding:0;cursor:pointer;field-sizing:content;max-width:120px}
  .back:hover{background:#EEF1ED}
</style>
</head>
<body>
<div style="max-width: 430px; min-height: 100vh; margin: 0 auto; box-sizing: border-box; background: #F5F6F3; color: #18211C; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; line-height: 1.45; display: flex; flex-direction: column">

  <header style="background: #FFFFFF; border-bottom: 1px solid #E2E6E1; padding: 14px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 2">
    <a class="back" href="index.html" aria-label="Back to home" style="width: 44px; height: 44px; margin: -6px 0 -6px -10px; display: flex; align-items: center; justify-content: center; border-radius: 8px">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#18211C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3 L5 9 L11 15"></path></svg>
    </a>
    <div style="flex: 1 1 auto; min-width: 0">
      <div class="mono" style="font-size: 15px; font-weight: 500" id="truck">SPR-—</div>
      <div style="font-size: 12px; color: #67736C">Zone <select id="zsel" aria-label="Zone"></select> · <span id="meta">–</span></div>
    </div>
    <span id="pill" style="font-size: 12px; font-weight: 500; color: #A85F00; background: #FBF1E2; border-radius: 999px; padding: 4px 10px">Pending</span>
  </header>

  <div style="flex: 1 1 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px">

    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #4E5A53">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#4E5A53" stroke-width="1.4" stroke-linejoin="round"><rect x="2.5" y="6" width="9" height="6" rx="1.2"></rect><path d="M4.5 6 V4.5 a2.5 2.5 0 0 1 5 0 V6"></path></svg>
      <span>Stops and order are fixed by the coordinator</span>
    </div>

    <section style="background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
      <div>
        <div style="font-size: 12px; color: #67736C" id="cur-lbl">Current stop</div>
        <div style="margin-top: 2px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em" id="cur-name">–</div>
        <div style="font-size: 12px; color: #67736C" id="cur-sub">–</div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: #EEF1ED; border-radius: 8px; overflow: hidden">
        <div style="background: #FAFBF9; padding: 10px">
          <div style="font-size: 11px; color: #67736C">PM2.5</div>
          <div class="mono" style="font-size: 17px; font-weight: 500" id="cur-pm">–</div>
        </div>
        <div style="background: #FAFBF9; padding: 10px">
          <div style="font-size: 11px; color: #67736C">Passes</div>
          <div class="mono" style="font-size: 17px; font-weight: 500" id="cur-passes">–</div>
        </div>
        <div style="background: #FAFBF9; padding: 10px">
          <div style="font-size: 11px; color: #67736C">Target</div>
          <div class="mono" style="font-size: 17px; font-weight: 500" id="cur-target">–</div>
        </div>
      </div>
      <button type="button" id="act" style="min-height: 48px; border: 0; border-radius: 10px; background: #1F6B48; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer">Start route</button>
    </section>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <section style="background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 12px; padding: 14px">
        <div style="display: flex; align-items: baseline; justify-content: space-between">
          <span style="font-size: 12px; color: #67736C">Water tank</span>
          <span class="mono" style="font-size: 15px; font-weight: 500" id="water-v">100%</span>
        </div>
        <div style="margin-top: 10px; height: 6px; background: #EEF1ED; border-radius: 3px; overflow: hidden">
          <div id="water-bar" style="width: 100%; height: 6px; background: #1D5C8C; border-radius: 3px"></div>
        </div>
      </section>
      <section style="background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 12px; padding: 14px">
        <div style="display: flex; align-items: baseline; justify-content: space-between">
          <span style="font-size: 12px; color: #67736C">Stops cleared</span>
          <span class="mono" style="font-size: 15px; font-weight: 500" id="prog-v">0 / 0</span>
        </div>
        <div id="prog" style="margin-top: 10px; display: grid; gap: 4px"></div>
      </section>
    </div>

    <section style="background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 12px">
      <h2 style="margin: 0; padding: 14px 16px 6px; font-size: 14px; font-weight: 600">Assigned route</h2>
      <ol id="route" style="list-style: none; margin: 0; padding: 0 16px 8px"></ol>
    </section>

    <section style="background: #FFFFFF; border: 1px solid #E2E6E1; border-radius: 12px; padding: 14px 16px">
      <h2 style="margin: 0 0 8px; font-size: 14px; font-weight: 600">Mission log</h2>
      <div id="log" style="display: flex; flex-direction: column; gap: 6px"></div>
    </section>
  </div>
</div>

<script>
// One truck, one mission. Stops come from the coordinator's plan (December
// scenario by default; ?src=live uses the live server's /api/plan). Each stop:
// drive -> spray (-42.5% PM2.5 per pass, 11% of the tank) -> cleared below the
// pre-position limit, or sprayed again. A low tank sends the truck to refill.
const P = new URLSearchParams(location.search);
const LIVE = P.get("src") === "live";
const SPRAY_R = 0.425, WATER_PER_PASS = 11, SPEED_KMPH = 22, DWELL_MIN = 8;
const C = {accent:"#1F6B48", amber:"#A85F00", red:"#B3261E", normal:"#7D8C84", blue:"#1D5C8C"};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const short = n => String(n).split(",")[0];
const agency = n => { const p = String(n).split(" - "); return p.length > 1 ? p[p.length-1].trim() + " station" : "Monitoring station"; };
const now = () => new Date().toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit", timeZone:"Asia/Kolkata"});
const hav = (a, b) => { const R = 6371, r = d => d*Math.PI/180, dLa = r(b[0]-a[0]), dLo = r(b[1]-a[1]);
  const h = Math.sin(dLa/2)**2 + Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); };

let PLAN = null, ACTIVE = 190, RISING = 152;
let E = null, STOPS = [], cur = 0, water = 100, phase = "idle", LOG = [], started = false, timer = null;

const tier = pm => pm >= ACTIVE ? "ACTIVE" : pm >= RISING ? "PRE" : "NORMAL";
const tierCol = pm => ({ACTIVE:C.red, PRE:C.amber, NORMAL:C.normal})[tier(pm)];
const passes = pm => pm < RISING ? 0 : Math.max(1, Math.ceil(Math.log(RISING/pm) / Math.log(1 - SPRAY_R)));
function log(text){ LOG.unshift({t:now(), text}); if(LOG.length > 30) LOG.pop(); }

async function load(){
  const url = LIVE ? "/api/plan" : "data/december_plan.json";
  try{
    const r = await fetch(url, {cache:"no-store"}); PLAN = await r.json();
    if(!r.ok || PLAN.error) throw new Error(PLAN.error || r.status);
  }catch(e){
    $("cur-name").textContent = "Plan not available";
    $("cur-sub").textContent = "Try again shortly.";
    $("act").disabled = true; return;
  }
  ACTIVE = PLAN.active_limit ?? ACTIVE; RISING = PLAN.rising_limit ?? RISING;
  const list = PLAN.clusters.filter(c => c.checkpoints.length);
  list.sort((a,b) => (a.kind === "priority") - (b.kind === "priority") || a.label.localeCompare(b.label, undefined, {numeric:true}));
  $("zsel").innerHTML = list.map(c => `<option value="${c.label}">${c.label}${c.kind === "priority" ? " (hotspot)" : ""}</option>`).join("");
  const want = P.get("zone");
  const start = list.find(c => c.label === want) || list.slice().sort((a,b) => b.checkpoints.length - a.checkpoints.length)[0];
  if(!start){ $("cur-name").textContent = "No spray stops right now"; $("cur-sub").textContent = "All stations are below the pre-position limit."; $("act").disabled = true; return; }
  $("zsel").value = start.label;
  $("zsel").onchange = () => pick($("zsel").value);
  pick(start.label);
}

function pick(label){
  clearTimeout(timer);
  E = PLAN.clusters.find(c => c.label === label);
  STOPS = E.checkpoints.map(c => ({...c, done:false, start:c.pm25}));
  cur = 0; water = 100; phase = "idle"; started = false; LOG = [];
  log(`Route assigned by coordinator · ${STOPS.length} stop${STOPS.length === 1 ? "" : "s"}, worst first`);
  history.replaceState(null, "", `?${LIVE ? "src=live&" : ""}zone=${encodeURIComponent(label)}`);
  render();
}

function etaMinutes(i){   // minutes from the current stop to stop i
  let m = 0;
  for(let k = cur; k < i; k++) m += hav([STOPS[k].lat, STOPS[k].lng], [STOPS[k+1].lat, STOPS[k+1].lng]) / SPEED_KMPH * 60 + DWELL_MIN;
  return Math.round(m);
}

function setPill(text, fg, bg){ const p = $("pill"); p.textContent = text; p.style.color = fg; p.style.background = bg; }

function render(){
  const n = STOPS.length, done = STOPS.filter(s => s.done).length, s = STOPS[cur];
  $("truck").textContent = `SPR-${E.label}`;
  $("meta").textContent = `${n} stop${n === 1 ? "" : "s"} · ${E.distance_km != null ? Number(E.distance_km).toFixed(1) + " km" : "holds position"}`;
  // status pill
  if(done === n) setPill("Complete", C.accent, "#E5F0EA");
  else if(phase === "driving" || phase === "refill") setPill("En route", C.blue, "#E6EEF5");
  else if(phase === "onsite" || phase === "spraying") setPill("Spraying", "#6B3FA0", "#EFE8F6");
  else setPill(started ? "Assigned" : "Pending", C.amber, "#FBF1E2");
  // current stop
  if(!s){
    $("cur-lbl").textContent = "Route complete";
    $("cur-name").textContent = "All stops cleared";
    $("cur-sub").textContent = `${n} of ${n} below ${RISING.toFixed(0)} µg/m³`;
    $("cur-pm").textContent = "–"; $("cur-pm").style.color = "#18211C";
    $("cur-passes").textContent = "0"; $("cur-target").textContent = `<${RISING.toFixed(0)}`;
  } else {
    $("cur-lbl").textContent = `Current stop · ${cur+1} of ${n}`;
    $("cur-name").textContent = short(s.station);
    $("cur-sub").textContent = agency(s.station);
    $("cur-pm").textContent = Math.round(s.pm25); $("cur-pm").style.color = tierCol(s.pm25);
    $("cur-passes").textContent = passes(s.pm25);
    $("cur-target").textContent = `<${RISING.toFixed(0)}`;
  }
  // action button
  const b = $("act"); b.disabled = false; b.className = "";
  if(!s){ b.textContent = "Route complete"; b.disabled = true; }
  else if(phase === "driving"){ b.textContent = `Driving to ${short(s.station)}…`; b.disabled = true; }
  else if(phase === "refill"){ b.textContent = "Refilling at STP depot…"; b.disabled = true; }
  else if(phase === "spraying"){ b.textContent = "Spraying…"; b.disabled = true; }
  else if(water < WATER_PER_PASS){ b.textContent = "Refill at depot"; b.className = "ghost"; }
  else if(phase === "onsite"){ b.textContent = `Spray ${short(s.station)}`; }
  else b.textContent = started ? `Drive to stop ${cur+1}` : "Start route";
  // gauges
  $("water-v").textContent = Math.round(water) + "%";
  $("water-bar").style.width = water + "%";
  $("water-bar").style.background = water < 20 ? C.red : water < 40 ? C.amber : C.blue;
  $("prog-v").textContent = `${done} / ${n}`;
  $("prog").style.gridTemplateColumns = `repeat(${Math.max(1,n)}, minmax(0, 1fr))`;
  $("prog").innerHTML = STOPS.map(x => `<div style="height:6px;border-radius:3px;background:${x.done ? C.accent : "#EEF1ED"}"></div>`).join("");
  // route list
  $("route").innerHTML = STOPS.map((x, i) => {
    const isCur = i === cur && !x.done, k = passes(x.pm25);
    const meta = x.done ? `Cleared · ${Math.round(x.start)} → ${Math.round(x.pm25)}`
      : isCur ? `Now · ${k} pass${k === 1 ? "" : "es"}`
      : `${etaMinutes(i)} min · ${k} pass${k === 1 ? "" : "es"}`;
    const ring = x.done || isCur ? C.accent : "#C9D1CB";
    const fill = isCur ? C.accent : x.done ? "#E5F0EA" : "#FFFFFF";
    const num = isCur ? "#FFFFFF" : x.done ? C.accent : "#4E5A53";
    return `<li style="display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid ${i === 0 ? "#FFFFFF" : "#EEF1ED"}">
      <span class="mono" style="width:24px;height:24px;flex:none;border-radius:50%;box-sizing:border-box;border:1.5px solid ${ring};background:${fill};color:${num};font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center">${x.done ? "✓" : i+1}</span>
      <div style="flex:1 1 auto;min-width:0"><div style="font-weight:500">${esc(short(x.station))}</div><div style="font-size:12px;color:#67736C">${meta}</div></div>
      <span class="mono" style="font-size:13px;color:${tierCol(x.pm25)}">${Math.round(x.pm25)}</span></li>`;
  }).join("");
  // log
  $("log").innerHTML = LOG.slice(0, 12).map(e => `<div style="display:flex;gap:12px;font-size:13px">
    <span class="mono" style="color:#67736C;flex:none">${e.t}</span><span>${esc(e.text)}</span></div>`).join("");
}

$("act").onclick = () => {
  const s = STOPS[cur]; if(!s) return;
  if(water < WATER_PER_PASS && phase !== "driving"){
    phase = "refill"; log("Tank low — driving to the STP depot to refill"); render();
    timer = setTimeout(() => { water = 100; phase = "idle"; log("Refilled to 100% at the STP depot"); render(); }, 2200);
    return;
  }
  if(phase === "idle"){
    started = true; phase = "driving";
    log(`Departed for ${short(s.station)}`); render();
    timer = setTimeout(() => { phase = "onsite"; log(`Arrived at ${short(s.station)} · PM2.5 ${Math.round(s.pm25)}`); render(); }, 1600);
  } else if(phase === "onsite"){
    phase = "spraying"; render();
    timer = setTimeout(() => {
      const before = s.pm25; s.pm25 = Math.round(before * (1 - SPRAY_R) * 10) / 10;
      water = Math.max(0, water - WATER_PER_PASS);
      if(s.pm25 < RISING){
        s.done = true; log(`Sprayed ${short(s.station)}: ${Math.round(before)} → ${Math.round(s.pm25)}, cleared`);
        cur++; phase = "idle";
        if(cur >= STOPS.length) log("All stops cleared · returning to depot");
      } else {
        phase = "onsite"; log(`Sprayed ${short(s.station)}: ${Math.round(before)} → ${Math.round(s.pm25)}, needs another pass`);
      }
      render();
    }, 1400);
  }
};

load();
</script>
</body>
</html>
